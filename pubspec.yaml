name: foliomed
description: "FolioMed: ward notes, patients and newborn follow-ups for hospital teams."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Backend and state
  supabase_flutter: ^2.8.0
  provider: ^6.1.2

  # Sign-in
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.3

  # Alerts
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2

  # Photos → text (on-device)
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0

  # Device and platform
  permission_handler: ^11.3.1
  device_info_plus: ^11.2.0
  app_settings: ^5.1.1
  android_intent_plus: ^5.2.0
  package_info_plus: ^8.1.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  in_app_review: ^2.0.9
  shared_preferences: ^2.3.3

  # Formatting and helpers
  intl: ^0.19.0
  timeago: ^3.7.0
  uuid: ^4.5.1
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/clinical/

# `dart run flutter_launcher_icons` regenerates the app icons from assets/icon.png.
flutter_launcher_icons:
  image_path: assets/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon.png
    background_color: "#0F6D99"
    theme_color: "#0F6D99"
