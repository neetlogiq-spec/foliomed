# Codemagic: iOS build → TestFlight.
#
# One-time setup in Codemagic:
#   • Team → Integrations → App Store Connect: add the API key
#     (Key ID ZCU49PSMCN, your Issuer ID) and name it "FolioMed ASC".
#   • App → Environment variables → group "foliomed-secrets":
#       SUPABASE_ANON_KEY, and (for push) FIREBASE_PROJECT_ID,
#       FIREBASE_MESSAGING_SENDER_ID, FIREBASE_IOS_API_KEY, FIREBASE_IOS_APP_ID
#   • Set ASC_APP_ID below to the app's numeric Apple ID.
workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: FolioMed ASC
    environment:
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
      groups:
        - foliomed-secrets
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.foliomed.app
      vars:
        ASC_APP_ID: "SET_ME"
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: "ios-v*"
    scripts:
      - name: Signing
        script: |
          keychain initialize
          xcode-project use-profiles
      - name: Dependencies
        script: |
          flutter pub get
          (cd ios && pod install --repo-update)
      - name: Next build number
        script: |
          LAST=$(app-store-connect get-latest-app-store-build-number "$ASC_APP_ID" 2>/dev/null || echo 0)
          echo "BUILD_NUMBER=$((LAST + 1))" >> "$CM_ENV"
      - name: Build
        script: |
          cat > env.json <<JSON
          {
            "SUPABASE_ANON_KEY": "$SUPABASE_ANON_KEY",
            "FIREBASE_PROJECT_ID": "${FIREBASE_PROJECT_ID:-}",
            "FIREBASE_MESSAGING_SENDER_ID": "${FIREBASE_MESSAGING_SENDER_ID:-}",
            "FIREBASE_IOS_API_KEY": "${FIREBASE_IOS_API_KEY:-}",
            "FIREBASE_IOS_APP_ID": "${FIREBASE_IOS_APP_ID:-}"
          }
          JSON
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define-from-file=env.json \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients: [kashyap2k007@gmail.com]
        notify: { success: true, failure: true }
