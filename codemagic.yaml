workflows:
  ios-release:
    name: FolioMed iOS - App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    # App Store Connect API key integration, created in Codemagic →
    # Team settings → Integrations using AuthKey_ZCU49PSMCN.p8
    # (Key ID ZCU49PSMCN + your Issuer ID). Name it exactly this:
    integrations:
      app_store_connect: Codemagic FolioMed

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.foliomed.app
      # Environment group "foliomed" (Codemagic → App settings → Environment
      # variables) must define SUPABASE_ANON_KEY.
      groups:
        - foliomed
      vars:
        BUNDLE_ID: "com.foliomed.app"
        # Numeric Apple ID of the app record in App Store Connect.
        APP_STORE_APPLE_ID: "YOUR_APP_STORE_APPLE_ID"
      flutter: 3.41.9
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.pub-cache
        - $FCI_BUILD_DIR/ios/Pods

    scripts:
      - name: Initialize keychain
        script: keychain initialize

      - name: Fetch Flutter packages
        script: flutter pub get

      - name: Set up provisioning profiles
        script: xcode-project use-profiles

      - name: Pod install
        script: |
          cd ios
          pod install --repo-update

      - name: Auto-bump build number
        script: |
          cd ios
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          agvtool new-version -all $((LATEST + 1))

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - kashyap2k007@gmail.com
        notify:
          success: true
          failure: true

