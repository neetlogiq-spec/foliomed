name: CI and website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    name: Analyse and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Database tests (Postgres)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql >/dev/null
          sudo service postgresql start
          for suite in supabase/tests/[1-9]*.sql; do
            sudo -u postgres psql -q -c "drop database if exists t" -c "create database t"
            for f in supabase/tests/00_supabase_stub.sql supabase/migrations/*.sql "$suite"; do
              sudo -u postgres psql -q -v ON_ERROR_STOP=1 -d t -f "$f" > /dev/null
            done
            echo "passed: $suite"
          done

  publish:
    name: Publish www.foliomed.app
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      # Secret: SUPABASE_ANON_KEY (the public anon key).
      - name: Web app
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: flutter build web --release --base-href /app/ --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: Put the site together
        run: |
          mkdir -p public/app public/status
          cp -R landing/. public/
          cp -R status/. public/status/
          cp -R build/web/. public/app/
          printf 'www.foliomed.app\n' > public/CNAME
          : > public/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
