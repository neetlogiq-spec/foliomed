# Flutter's recommended lints, plus a few that keep FolioMed's code tidy.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - macos/**
    - linux/**

linter:
  rules:
    prefer_single_quotes: true
    prefer_final_locals: true
    avoid_print: true
    unawaited_futures: false
